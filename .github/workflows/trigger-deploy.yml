name: Trigger Deploy in Main Repository

on:
  push:
    branches:
      - master

jobs:
  trigger-main-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Get Last Commit Message
        id: vars
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message extracted: $COMMIT_MSG"
          echo "::set-output name=commit_message::$COMMIT_MSG"

      - name: Send dispatch event to main repository
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Sending commit message: ${{ steps.vars.outputs.commit_message }}"
          curl -X POST -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/PrincessJava/enrollment-project/dispatches \
            -d "{\"event_type\": \"deploy_trigger\", \"client_payload\": {\"commit_message\": \"${{ steps.vars.outputs.commit_message }}\"}}"
